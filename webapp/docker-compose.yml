services:
  website:
    build: .
    # image: techfellow/webappa:latest
    container_name: website
    ports:
      - "80:80"
    environment:
      TZ: Europe/Warsaw
      NGINX_HOST: web.local
      NGINX_PORT: 80
    # Volumes store your data between container upgrades
    # volumes:
    #   - ./website:/usr/share/nginx/html:ro
    restart: unless-stopped
    