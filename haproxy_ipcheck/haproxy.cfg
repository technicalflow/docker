#---------------------------------------------------------------------
# Global settings
#---------------------------------------------------------------------
global
    log stdout format raw local0 info
    maxconn 2000

#---------------------------------------------------------------------
# Common defaults
#---------------------------------------------------------------------
defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    option                  redispatch
    retries                 3
    timeout queue           20s
    timeout connect         10s
    timeout client          10s
    timeout server          10s
    timeout check           10s
    maxconn                 1000

#---------------------------------------------------------------------
# Docker embedded DNS resolver for dynamic service discovery
#---------------------------------------------------------------------
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry   1s
    hold valid      10s

#---------------------------------------------------------------------
# Frontend: Public traffic on port 80 (Layer 4 TCP)
#---------------------------------------------------------------------
frontend myfrontend
    bind *:80
    mode tcp
    default_backend myservers

#---------------------------------------------------------------------
# Backend: Dynamic round-robin load balancing across web replicas
#---------------------------------------------------------------------
backend myservers
    mode tcp
    balance roundrobin
    server-template web 1-10 web:80 check check-send-proxy send-proxy-v2 resolvers docker init-addr libc,none

#---------------------------------------------------------------------
# Observability: HAProxy stats dashboard on port 8404
#---------------------------------------------------------------------
listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s

