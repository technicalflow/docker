services:
  timemachine:
    # build: .
    image: samba-timemachine:latest
    container_name: timemachine
    restart: unless-stopped
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - CHOWN
    #   - DAC_OVERRIDE
    #   - FOWNER
    #   - SETGID
    #   - SETUID
    ports:
      - "10445:445"
    environment:
      - USER=timemachine
      # - PASS=secretpassword  # Optional: defaults to a random 16-character password logged on startup
      - USERID=1311
      - GROUPID=1311
      - SHARENAME=Data
      # - TMSIZE=1024000      # Optional: backup quota in MB (0 = unlimited)
      # - FORCE_PERMISSIONS_RESET=false  # Optional: set to true to force recursive permission reset
    volumes:
      - /backups/timemachine:/backups:rw
    # healthcheck:
    #   test: ["CMD", "smbcontrol", "smbd", "ping"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3