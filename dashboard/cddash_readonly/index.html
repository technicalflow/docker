<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Lab Dashboard</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox" style="display: none !important;">

  <div class="dashboard-wrapper">
    <!-- Top Navigation Bar -->
    <header class="top-nav">
      <div class="brand">
        <div class="brand-logo">
          <i class="fa-solid fa-house" style="color: white; font-size: 18px;"></i>
        </div>
        <span class="brand-name">Home Lab</span>
      </div>

      <div class="search-container">
        <span class="search-icon">
          <i class="fa-solid fa-magnifying-glass" style="font-size: 14px;"></i>
        </span>
        <input type="text" class="search-input" placeholder="Search services, address, or domain (or press '/')...">
      </div>

      <div class="nav-actions">
        <a href="" class="btn btn-outline" onclick="window.location.reload(); return false;">
          <i class="fa-solid fa-rotate-right" style="margin-right: 6px; font-size: 12px;"></i>Refresh
        </a>
        <a href="" class="btn btn-primary" onclick="window.location.reload(); return false;">
          <i class="fa-solid fa-arrows-rotate" style="margin-right: 6px; font-size: 12px;"></i>Rescan
        </a>
      </div>
    </header>

    <!-- Sub Status Bar -->
    <div class="status-bar">
      <div class="status-left">
        <span class="status-indicator"></span>
        <span class="status-text"><strong>0</strong> Services Active</span>
        <span class="status-divider"></span>
        <span class="scan-time">Last scan: Never</span>
      </div>
      <div class="status-right">
        <label for="theme-toggle" class="meta-item">
          <span class="theme-icon-dark">
            <i class="fa-solid fa-sun" style="font-size: 13px;"></i>
            Light Theme
          </span>
          <span class="theme-icon-light">
            <i class="fa-solid fa-moon" style="font-size: 13px;"></i>
            Dark Theme
          </span>
        </label>
      </div>
    </div>

    <!-- Main Content Area -->
    <main class="content-container">
      <div class="section-header">
        <div class="section-title-wrap">
          <h2 class="section-title">Services</h2>
          <span class="badge-count">0</span>
        </div>
      </div>

      <!-- Services Grid -->
      <div class="services-grid">
        <!-- SERVICES_START -->
        <div class="empty-state">
          <div class="empty-state-icon">
            <i class="fa-solid fa-server" style="font-size: 32px;"></i>
          </div>
          <h3>No Services Detected</h3>
          <p>Waiting for Caddyfile or add your first service using the button above.</p>
        </div>
        <!-- SERVICES_END -->
      </div>
    </main>
  </div>
</body>
</html>
