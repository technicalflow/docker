# CLI clients get plain text on "/"; browsers get the web page.
map $http_user_agent $is_cli {
    ~*^(curl|wget|httpie)  1;
    default                0;
}

# API clients asking for JSON on "/" get /json (browsers never send this).
map $http_accept $wants_json {
    ~*application/json  1;
    default             0;
}

js_path   /usr/share/nginx/html/;
js_import smiley.js;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # UTF-8 for emoji in JS files; always revalidate (smiley changes daily)
    charset utf-8;
    charset_types text/html text/css application/javascript;
    add_header Cache-Control "no-cache";

    location = / {
        if ($wants_json) { rewrite ^ /json last; }
        if ($is_cli)     { rewrite ^ /text last; }
    }

    location = /text { js_content smiley.text; }
    location = /json { js_content smiley.json; }

    location / {
        try_files $uri $uri/ =404;
    }
}
