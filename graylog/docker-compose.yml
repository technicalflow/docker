# For DataNode setup, graylog starts with a preflight UI, this is a change from just using OpenSearch/Elasticsearch.
# Please take a look at the README at the top of this repo or the regular docs for more info.
# Initial Password: podman compose logs graylog --tail 50

services:
  # MongoDB: https://hub.docker.com/_/mongo/
  mongodb:
    image: "docker.io/mongo:7.0"
    restart: "on-failure"
    networks:
      - graylog
    volumes:
      - "mongodb_data:/data/db"
      - "mongodb_config:/data/configdb"

  # For DataNode setup, graylog starts with a preflight UI, this is a change from just using OpenSearch/Elasticsearch.
  # Please take a look at the README at the top of this repo or the regular docs for more info.
  # Graylog Data Node: https://hub.docker.com/r/graylog/graylog-datanode

  # ⚠️ Make sure this is set on the host before starting:
  # echo "vm.max_map_count=262144" | sudo tee -a /etc/sysctl.conf
  # sudo sysctl -p
  datanode:
    image: "docker.io/graylog/graylog-datanode:7.1"
    hostname: "datanode"
    environment:
      GRAYLOG_DATANODE_NODE_ID_FILE: "/var/lib/graylog-datanode/node-id"
      # GRAYLOG_DATANODE_PASSWORD_SECRET and GRAYLOG_PASSWORD_SECRET MUST be the same value
      GRAYLOG_DATANODE_PASSWORD_SECRET: "2287394ad36474a681a1a80d3ec5e8af418f0447e57bea6b67d4b5c8fe3a72d6"
      GRAYLOG_DATANODE_MONGODB_URI: "mongodb://mongodb:27017/graylog"
    # ulimits:
    #   memlock:
    #     hard: -1
    #     soft: -1
    # nofile:
    #   soft: 65536
    #   hard: 65536
    ports:
      - "127.0.0.1:8999:8999/tcp" # DataNode API
      - "127.0.0.1:9200:9200/tcp"
      - "127.0.0.1:9300:9300/tcp"
    networks:
      - graylog
    volumes:
      # - "graylog-datanode:/var/lib/graylog-datanode"
      - "/data/Backup/graylog/datanode:/var/lib/graylog-datanode:U"
    restart: "on-failure"

  # Graylog: https://hub.docker.com/r/graylog/graylog-enterprise
  graylog:
    hostname: "server"
    image: "docker.io/graylog/graylog:7.1"
    depends_on:
      mongodb:
        condition: "service_started"
      datanode:
        condition: "service_started"
    entrypoint: "/usr/bin/tini --  /docker-entrypoint.sh"
    environment:
      GRAYLOG_NODE_ID_FILE: "/usr/share/graylog/data/data/node-id"
      # GRAYLOG_DATANODE_PASSWORD_SECRET and GRAYLOG_PASSWORD_SECRET MUST be the same value
      GRAYLOG_PASSWORD_SECRET: "2287394ad36474a681a1a80d3ec5e8af418f0447e57bea6b67d4b5c8fe3a72d6"
      GRAYLOG_ROOT_PASSWORD_SHA2: "2aa6e5b0b8dc4d316dce118b1d195e96fd6a4b18b442bc847d25dd4e9b7ac0de"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_HTTP_EXTERNAL_URI: "http://localhost:9000/"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
      GRAYLOG_TIMEZONE: "Europe/Warsaw"
    ports:
      - "127.0.0.1:5044:5044/tcp" # Beats
      - "127.0.0.1:5140:5140/udp" # Syslog
      - "127.0.0.1:5140:5140/tcp" # Syslog
      - "127.0.0.1:5555:5555/tcp" # RAW TCP
      - "127.0.0.1:5555:5555/udp" # RAW UDP
      - "0.0.0.0:9000:9000/tcp" # Server API
      - "127.0.0.1:12201:12201/tcp" # GELF TCP
      - "127.0.0.1:12201:12201/udp" # GELF UDP
      #- "127.0.0.1:10000:10000/tcp" # Custom TCP port
      #- "127.0.0.1:10000:10000/udp" # Custom UDP port
      - "127.0.0.1:13301:13301/tcp" # Forwarder data
      - "127.0.0.1:13302:13302/tcp" # Forwarder config
    networks:
      - graylog
    volumes:
      # - "graylog_data:/usr/share/graylog/data"
      - "/data/Backup/graylog/server:/usr/share/graylog/data"

    restart: "on-failure"

networks:
  graylog:
    driver: "bridge"

volumes:
  mongodb_data:
  mongodb_config:
  # graylog-datanode:
  # graylog_data:
