name: build-image

on:
  workflow_call:
    inputs:
      context:
        description: Build context folder
        required: true
        type: string
      image:
        description: Docker Hub image with tag
        required: true
        type: string
      run_args:
        description: Extra docker run args for the smoke test (e.g. mounts, env)
        required: false
        type: string
        default: ""
      curl_args:
        description: Extra curl args for the smoke test
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Build amd64 only and load it locally for the smoke test.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          tags: ci-test:latest
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ inputs.context }}

      # Fail unless the app answers HTTP 2xx on port 80 within ~20s.
      - name: Smoke test
        env:
          RUN_ARGS: ${{ inputs.run_args }}
          CURL_ARGS: ${{ inputs.curl_args }}
        run: |
          docker run -d --name smoke -p 8080:80 $RUN_ARGS ci-test:latest
          curl -fsS -o /dev/null --retry 10 --retry-delay 2 --retry-connrefused $CURL_ARGS http://localhost:8080/ \
            || { docker logs smoke; exit 1; }

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          tags: ${{ inputs.image }}
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ inputs.context }}
          cache-to: type=gha,mode=max,scope=${{ inputs.context }}
