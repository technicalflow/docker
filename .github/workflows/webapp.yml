name: webapp

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp.yml"
      - ".github/workflows/_build.yml"
  schedule:
    - cron: "0 7 * * 1" 
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      context: webapp
      image: techfellow/webappa:latest
    secrets: inherit
