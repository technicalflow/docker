name: icanhaz

on:
  push:
    branches: [master]
    paths:
      - "icanhaz/**"
      - ".github/workflows/icanhaz.yml"
      - ".github/workflows/_build.yml"
  schedule:
    - cron: "0 5 * * 1" 
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      context: icanhaz
      image: techfellow/ipcheck:latest
      curl_args: --haproxy-protocol # gunicorn runs with --proxy-protocol
    secrets: inherit
