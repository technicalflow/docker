name: cddash

on:
  push:
    branches: [master]
    paths:
      - "caddy-dashboard/cddash_readonly/**"
      - ".github/workflows/cddash.yml"
      - ".github/workflows/_build.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      context: caddy-dashboard/cddash_readonly
      image: techfellow/cadash:latest
      run_args: -v ${{ github.workspace }}/caddy-dashboard/cddash_readonly/Caddyfile:/etc/caddy/Caddyfile:ro
    secrets: inherit
