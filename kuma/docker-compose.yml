---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    mem_limit: 256m
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - /data/Backup/containers/uptime:/app/data 
    environment:
      - TZ=Europe/Warsaw
      - UMASK=0022  # Set your file permissions manually
      - PUID=1000
      - PGID=1000
    networks:
      - kuma_network 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kuma_network:
    driver: bridge

volumes:
  kuma_data: