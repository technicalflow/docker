services:
  web:
    image: nginx:latest
    networks:
      - lbnet
    environment:
      - TZ=Europe/Warsaw
      - PUID=1000
      - PGID=1000
    deploy:
      replicas: 4
      endpoint_mode: dnsrr
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 64M

  haproxy:
    image: haproxy:3.0
    depends_on:
      - web
    ports:
      - target: 80
        published: 80
        mode: ingress
      - target: 8404
        published: 8404
        mode: ingress
    configs:
      - source: haproxy_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
    networks:
      - lbnet
    environment:
      - TZ=Europe/Warsaw
      - PUID=1000
      - PGID=1000
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 64M
      # mode: global # For one replica per node

configs:
  haproxy_cfg:
    file: ./haproxy.cfg

networks:
  lbnet:
    driver: overlay
    attachable: true
